<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micrometry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #020c1b 0%, #0a1628 25%, #0d1f3c 50%, #061a2e 75%, #020c1b 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    overflow: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: float linear infinite;
  }

  @keyframes float {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* Top accent line */
  .accent-line-top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      #00e5ff, #7c4dff, #00e676, #00e5ff, #7c4dff
    );
    background-size: 200% 100%;
    animation: lineShimmer 4s linear infinite;
    z-index: 10;
    opacity: 0.85;
  }

  .accent-line-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      #7c4dff, #00e5ff, #00e676, #7c4dff, #00e5ff
    );
    background-size: 200% 100%;
    animation: lineShimmer 4s linear infinite reverse;
    z-index: 10;
    opacity: 0.85;
  }

  @keyframes lineShimmer {
    0%   { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  /* Main card */
  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 50px;
    max-width: 700px;
    width: 90%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(0, 229, 255, 0.1);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    animation: cardFadeIn 1s ease-out;
  }

  @keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Microscope Icon */
  .icon-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 30px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .microscope-icon {
    position: relative;
    width: 60px;
    height: 80px;
  }

  /* Eyepiece tube */
  .microscope-icon .eyepiece {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%) rotate(-12deg);
    width: 8px;
    height: 35px;
    background: linear-gradient(180deg, #00e5ff, #7c4dff);
    border-radius: 4px 4px 2px 2px;
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
  }

  .microscope-icon .eyepiece::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 6px;
    background: rgba(0, 229, 255, 0.8);
    border-radius: 3px;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
  }

  /* Arm */
  .microscope-icon .arm {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 30px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
  }

  /* Stage */
  .microscope-icon .stage {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 5px;
    background: rgba(0, 229, 255, 0.3);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
  }

  /* Base */
  .microscope-icon .base {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 8px;
    background: linear-gradient(90deg, #7c4dff, #00e5ff);
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(124, 77, 255, 0.3);
  }

  /* Objective lens */
  .microscope-icon .objective {
    position: absolute;
    bottom: 23px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 12px;
    background: rgba(0, 230, 118, 0.6);
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(0, 230, 118, 0.4);
  }

  /* Glow ring behind microscope */
  .icon-wrap::before {
    content: '';
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, transparent 70%);
    animation: pulseGlow 3s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50%      { transform: scale(1.3); opacity: 1; }
  }

  /* Title */
  .title {
    font-size: 3.2rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #e0f7ff 0%, #00e5ff 30%, #7c4dff 60%, #00e676 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleShimmer 4s linear infinite;
    line-height: 1.2;
  }

  @keyframes titleShimmer {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  /* Subtitle */
  .subtitle {
    font-size: 1.15rem;
    color: rgba(160, 185, 220, 0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    font-weight: 300;
  }

  /* CTA Button */
  .cta-btn {
    display: inline-block;
    padding: 16px 48px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
    text-decoration: none;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #00e5ff 0%, #7c4dff 50%, #00e676 100%);
    background-size: 200% 200%;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
    animation: btnGlow 3s ease-in-out infinite;
  }

  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3); background-position: 0% 50%; }
    50%      { box-shadow: 0 4px 35px rgba(124, 77, 255, 0.5), 0 0 60px rgba(0, 229, 255, 0.15); background-position: 100% 50%; }
  }

  .cta-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 8px 40px rgba(0, 229, 255, 0.5);
  }

  .cta-btn:active {
    transform: translateY(-1px) scale(1.01);
  }

  .cta-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.15),
      transparent
    );
    transform: rotate(25deg);
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { left: -60%; }
    50%      { left: 60%; }
  }

  .btn-arrow {
    display: inline-block;
    margin-left: 8px;
    transition: transform 0.3s ease;
  }

  .cta-btn:hover .btn-arrow {
    transform: translateX(4px);
  }

  /* Footer note */
  .footer-note {
    margin-top: 36px;
    font-size: 0.8rem;
    color: rgba(107, 122, 153, 0.5);
    letter-spacing: 1px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .card {
      padding: 40px 24px;
    }
    .title {
      font-size: 2rem;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
    .cta-btn {
      padding: 14px 36px;
      font-size: 0.95rem;
    }
    .icon-wrap { width: 80px; height: 80px; }
    .microscope-icon { width: 48px; height: 64px; }
    .microscope-icon .eyepiece { height: 28px; width: 6px; }
    .microscope-icon .eyepiece::before { width: 12px; height: 5px; top: -5px; }
    .microscope-icon .arm { height: 24px; width: 5px; top: 22px; }
    .microscope-icon .stage { width: 32px; height: 4px; bottom: 14px; }
    .microscope-icon .base { width: 40px; height: 7px; }
    .microscope-icon .objective { height: 10px; bottom: 18px; }
  }
</style>
</head>
<body>

<div class="accent-line-top"></div>
<div class="accent-line-bottom"></div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<!-- Main Card -->
<div class="card">
  <div class="icon-wrap">
    <div class="microscope-icon">
      <div class="eyepiece"></div>
      <div class="arm"></div>
      <div class="objective"></div>
      <div class="stage"></div>
      <div class="base"></div>
    </div>
  </div>
  <h1 class="title">Micrometry</h1>
  <p class="subtitle">Calibration, Measurement &amp; Analysis</p>
  <a href="simulation.html" class="cta-btn">
    Launch Simulator <span class="btn-arrow">&rarr;</span>
  </a>
  <p class="footer-note">Interactive 3D Lab Simulator</p>
</div>

<script>
  // Generate floating particles
  (function() {
    var container = document.getElementById('particles');
    var colors = [
      'rgba(0,229,255,0.5)', 'rgba(124,77,255,0.4)', 'rgba(0,230,118,0.35)',
      'rgba(0,229,255,0.3)', 'rgba(124,77,255,0.3)', 'rgba(0,230,118,0.25)',
      'rgba(100,180,255,0.3)', 'rgba(200,160,255,0.25)'
    ];
    for (var i = 0; i < 30; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = Math.random() * 4 + 2;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(p);
    }
  })();
</script>
</body>
</html>
